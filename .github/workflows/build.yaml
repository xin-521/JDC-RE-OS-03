name: Build OpenWrt 25.12 + NSS (qualcommax/ipq50xx, jdcloud re-cs-03)

permissions:
  contents: write
  actions: write

# A run takes ~3h, so a new push must retire the running one instead of leaving a
# stale build to publish a release alongside the newer one.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build.yaml'
      - 're-cs-03.config'
      - 'patches/**'
      - 'ci/**'
      - 'files/**'
  workflow_dispatch:

env:
  # OpenWrt 25.12 stable + the NSS patch set on top (kernel 6.12). Vanilla upstream
  # 25.12 carries no NSS symbols at all, so base and offload are one tree here.
  REMOTE_REPOSITORY: qosmio/openwrt-ipq
  REMOTE_BRANCH: 25.12-nss
  CONFIG_FILE: re-cs-03.config
  CUSTOM_FILES_PATH: files/
  RELEASE_PREFIX: stable-nss
  ENV: main

jobs:
  check_commits:
    name: Check for new commits
    runs-on: ubuntu-24.04
    outputs:
      new_commits: ${{ steps.check_commits.outputs.new_commits }}
      latest_commit_sha: ${{ steps.check_commits.outputs.latest_commit_sha }}
    steps:
      - name: Check for new commits
        id: check_commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha=$(gh api "repos/${{ env.REMOTE_REPOSITORY }}/commits/${{ env.REMOTE_BRANCH }}" --jq .sha)
          release_body=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .body 2>/dev/null || echo "")

          new_commits=$([[ "$release_body" == *"$latest_sha"* ]] && echo "false" || echo "true")

          echo "new_commits=$new_commits" >> "$GITHUB_OUTPUT"
          echo "latest_commit_sha=$latest_sha" >> "$GITHUB_OUTPUT"

  build:
    name: Build OpenWrt
    needs: check_commits
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || needs.check_commits.outputs.new_commits == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: sudo apt update && sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget patch
      - name: Checkout remote repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REMOTE_REPOSITORY }}
          ref: ${{ env.REMOTE_BRANCH }}
          fetch-depth: 1

      - name: Show tree info
        run: |
          df -hT
          echo "repo:   ${{ env.REMOTE_REPOSITORY }}@${{ env.REMOTE_BRANCH }}"
          echo "kernel: $(sed -n 's/^KERNEL_PATCHVER:=//p' target/linux/qualcommax/Makefile)"
          git log -1 --format='tree tip: %H %ad %s' --date=short | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          path: "builder_repo"
          
      - name: Add custom patches
        run: |
          set -euo pipefail
          df -hT
          # Applied per file on purpose: `git apply` is atomic, so one drifted file
          # would block the whole series -- including the two binary board files that
          # only git can apply. A rejected file is ported by ci/nss-port.py below.
          # relative dir on purpose: a Windows/msys2 runner root maps /tmp differently
          # for bash and python3, a relative path resolves the same for both
          PDIR=.patchparts
          rm -rf "$PDIR"; mkdir -p "$PDIR"
          python3 - "$PDIR" <<'PY'
          import io, os, re, sys
          out = sys.argv[1]
          p = io.open('builder_repo/patches/re-cs-03.patch', encoding='utf-8', newline='').read()
          parts = [c for c in re.split(r'(?m)^(?=diff --git )', p) if c.strip()]
          for i, c in enumerate(parts):
              io.open(os.path.join(out, '%02d.patch' % i), 'w', encoding='utf-8', newline='').write(c)
          print("%d patch parts" % len(parts))
          PY
          shopt -s nullglob
          rejected=""
          for part in "$PDIR"/*.patch; do
            f="$(sed -n 's|^diff --git a/[^ ]* b/||p' "$part" | head -1)"
            sha256sum "$part"
            if git apply --verbose "$part"; then
              echo "applied: $f"
            else
              echo "::warning::hunk rejected on this tree (will be ported): $f"
              rejected="$rejected $f"
            fi
          done
          echo "rejected:${rejected:- none}" | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"

      - name: Port the device support onto this tree
        run: |
          set -euo pipefail
          # Fallback for anything the series rejected: same content, anchored on
          # lines that exist on either tree, idempotent (marker check per edit).
          python3 builder_repo/ci/nss-port.py
            
      - name: Update and install feeds
        run: |
          df -hT
          # third-party feed supplying the small-package apps we still use
          echo 'src-git small https://github.com/kenzok8/small-package' >> feeds.conf.default
          # luci-app-diskman lives in its own feed (lisaac/), not in small-package.
          # It pulls luci-compat, parted, blkid, e2fsprogs and the fs kmods itself.
          echo 'src-git diskman https://github.com/lisaac/luci-app-diskman.git' >> feeds.conf.default
          #echo 'src-git custom https://github.com/kiddin9/kwrt-packages' >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a -p luci && ./scripts/feeds install -a -p packages && ./scripts/feeds install -a -p small && ./scripts/feeds install -a -p diskman
          git clone https://github.com/Openwrt-Passwall/openwrt-passwall2.git package/feeds/luci/luci-app-passwall2
          git clone https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git package/utils/passwall2
          git clone https://github.com/jerrykuku/luci-theme-argon.git package/feeds/luci/luci-theme-argon
          git clone https://github.com/jerrykuku/luci-app-argon-config.git package/feeds/luci/luci-app-argon-config
          # this tree's feeds.conf.default already points at both NSS feeds
          ./scripts/feeds install -a -p nss_packages || echo "::warning::feeds install -p nss_packages failed"
          ./scripts/feeds install -a -p sqm_scripts_nss || echo "::warning::feeds install -p sqm_scripts_nss failed"
          # 6.12 enables -Wmissing-prototypes/-Wmissing-declarations globally and this
          # tree promotes warnings to errors; the QSDK HAL file the fork never built
          # (qca-nss-crypto's ipq50xx one) does not silence them itself.
          python3 builder_repo/ci/nss-warnings.py
          #git clone https://github.com/sbwml/openwrt-qBittorrent package/feeds/qBittorrent

      - name: Setup configuration and custom files
        run: |
          df -hT
          cp builder_repo/${{ env.CONFIG_FILE }} .config
          make defconfig -j$(nproc)
          mkdir -p ${{ env.CUSTOM_FILES_PATH }}
          [ -d "builder_repo/${{ env.CUSTOM_FILES_PATH }}" ] && mv builder_repo/${{ env.CUSTOM_FILES_PATH }}* ${{ env.CUSTOM_FILES_PATH }} || true

      - name: Verify configuration and patches applied
        run: |
          set -euo pipefail
          echo "== config symbols (fatal) =="
          # want=y|m -> line must read "SYM=want". want=n -> must NOT be y/m,
          # because kconfig writes a bool 'n' as "# SYM is not set", not "SYM=n".
          check() {
            local sym="$1" want="$2" got
            if [ "$want" = "n" ]; then
              if grep -qE "^${sym}=[ym]$" .config; then got="SET"; else got="not-set"; fi
              printf '  %-58s %s\n' "$sym" "$got"
              [ "$got" = "not-set" ] || { echo "  ^^^ expected ${sym} to be n (unset)"; exit 1; }
            else
              got="$(grep -m1 -E "^${sym}=" .config || true)"
              printf '  %-58s %s\n' "$sym" "${got:-<MISSING>}"
              [ "$got" = "${sym}=${want}" ] || { echo "  ^^^ expected ${sym}=${want}"; exit 1; }
            fi
          }
          check CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_jdcloud_re-cs-03 y
          check CONFIG_ALL_KMODS y
          check CONFIG_PACKAGE_luci-app-passwall2 n
          check CONFIG_PACKAGE_kmod-nft-socket y
          check CONFIG_PACKAGE_kmod-nft-tproxy y
          check CONFIG_PACKAGE_kmod-nft-nat y
          check CONFIG_PACKAGE_kmod-ipt-nat y
          check CONFIG_PACKAGE_iptables-mod-tproxy y
          check CONFIG_PACKAGE_ip6tables-mod-nat y
          check CONFIG_BUSYBOX_CUSTOM y
          check CONFIG_BUSYBOX_CONFIG_WATCH y
          # BUSYBOX_CUSTOM switches the applet source DEFAULT_* -> CONFIG_*; assert a few
          # core applets so a stripped busybox can never reach the image unnoticed.
          for a in LS CAT MOUNT PS TOP; do check "CONFIG_BUSYBOX_CONFIG_${a}" y; done

          echo "== every CONFIG_PACKAGE_*=y in the seed must survive make defconfig (fatal) =="
          # A seed line whose package the scanner cannot see (missing feed, broken
          # `include ../../luci.mk`, wrong PKG_NAME) is dropped silently by kconfig and
          # only shows up hours later as a broken firmware. Assert it here instead, and
          # say whether kconfig knew the symbol at all.
          miss=0; n=0
          while read -r sym; do
            n=$((n + 1))
            if grep -qE "^${sym}=[ym]$" .config; then continue; fi
            k="${sym#CONFIG_}"
            if grep -qE "^config ${k}( |$)" tmp/.config-package.in 2>/dev/null; then
              why="kconfig knows it but did not select it (missing dep/feed)"
            else
              nbase=$(grep -cE "^config ${k%-[^-]*}( |$)" tmp/.config-package.in 2>/dev/null || true)
              why="NOT in tmp/.config-package.in (scanner never saw the package); sibling '${k%-[^-]*}' entries: ${nbase}"
            fi
            echo "  MISSING in .config: $sym  ->  $why"
            miss=1
          done < <(grep -oE '^CONFIG_PACKAGE_[A-Za-z0-9._+-]+=y' builder_repo/${{ env.CONFIG_FILE }} | sed 's/=y$//' | sort -u)
          echo "  checked $n seed CONFIG_PACKAGE_*=y symbols"
          [ "$miss" = 0 ] || { echo "  ^^^ seed package(s) dropped by kconfig"; exit 1; }

          echo "== config symbols (soft) =="
          for sym in CONFIG_PACKAGE_luci-app-qbittorrent CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_SingBox; do
            if grep -qE "^${sym}=[ym]$" .config; then s="$(grep -m1 -E "^${sym}=" .config)"; else s="not-set/absent"; fi
            printf '  %-58s %s\n' "$sym" "$s"
          done

          echo "== patch artifacts (fatal) =="
          for f in \
            target/linux/qualcommax/dts/ipq5018-re-cs-03.dts \
            target/linux/qualcommax/ipq50xx/base-files/etc/board.d/02_network \
            target/linux/qualcommax/ipq50xx/base-files/lib/upgrade/platform.sh \
            target/linux/qualcommax/ipq50xx/base-files/etc/hotplug.d/firmware/11-ath11k-caldata \
            package/firmware/ipq-wifi/files/board-jdcloud_re-cs-03.ipq5018 ; do
            [ -f "$f" ] || { echo "  MISSING $f"; exit 1; }
            echo "  ok $f"
          done
          grep -q 'jdcloud,re-cs-03' target/linux/qualcommax/ipq50xx/base-files/lib/upgrade/platform.sh
          grep -q 'jdcloud,re-cs-03' target/linux/qualcommax/ipq50xx/base-files/etc/board.d/02_network

          echo "== custom files / hostname (fatal) =="
          grep -q "hostname='OpenWrt'" package/base-files/files/bin/config_generate
          echo "  ok config_generate hostname=OpenWrt"
          [ -f files/etc/shadow ] || { echo "  MISSING files/etc/shadow"; exit 1; }
          grep -q '^root:\$6\$' files/etc/shadow || { echo "  files/etc/shadow has no root hash"; exit 1; }
          echo "  ok files/etc/shadow (root password preset)"

          echo "== IPv6 enabled (fatal) =="
          grep -q "set network.lan.ipv6='1'" files/etc/uci-defaults/999-QOL_config
          grep -q "set network.wan.ipv6='1'" files/etc/uci-defaults/999-QOL_config
          grep -q "set network.@device\[0\].ipv6='1'" files/etc/uci-defaults/999-QOL_config
          grep -q "set dhcp.lan.ra='server'" files/etc/uci-defaults/999-QOL_config
          grep -q "set dhcp.lan.dhcpv6='server'" files/etc/uci-defaults/999-QOL_config
          echo "  ok IPv6 enabled (lan/wan/br-lan, LAN RA+DHCPv6 server)"

          echo "== NSS (fatal: the whole point of this tree) =="
          nsscheck() {
            local sym="$1" got
            got="$(grep -m1 -E "^${sym}=" .config || true)"
            printf '  %-52s %s\n' "$sym" "${got:-<MISSING>}"
            [ "$got" = "${sym}=y" ] || { echo "  ^^^ expected ${sym}=y"; exit 1; }
          }
          nsscheck CONFIG_PACKAGE_kmod-qca-nss-drv
          nsscheck CONFIG_PACKAGE_kmod-qca-nss-ecm
          nsscheck CONFIG_ATH11K_NSS_SUPPORT
          nsscheck CONFIG_PACKAGE_MAC80211_NSS_SUPPORT
          # download path: the tree carries qca-ssdk + qca-nss-dp itself
          if grep -qE '^CONFIG_PACKAGE_kmod-qca-nss-dp=y' .config; then
            echo "  ok CONFIG_PACKAGE_kmod-qca-nss-dp"
          elif grep -qE '^CONFIG_PACKAGE_kmod-qca-ssdk=y' .config; then
            echo "  ok CONFIG_PACKAGE_kmod-qca-ssdk"
          else
            echo "  neither kmod-qca-nss-dp nor kmod-qca-ssdk selected"; exit 1
          fi
          # the device's DEVICE_PACKAGES name this package, but only a registered
          # package makes the image; check the scanner, not just our own file
          grep -qE '^[[:space:]]*config PACKAGE_ipq-wifi-jdcloud_re-cs-03([[:space:]]|$)' tmp/.config-package.in \
            || { echo "  ipq-wifi-jdcloud_re-cs-03 not registered in tmp/.config-package.in"; exit 1; }
          echo "  ok ipq-wifi-jdcloud_re-cs-03 registered"
          grep -q 'caldata_extract_mmc()' package/base-files/files/lib/functions/caldata.sh \
            || { echo "  caldata_extract_mmc() missing from caldata.sh"; exit 1; }
          echo "  ok caldata_extract_mmc() available"
          for f in \
            target/linux/qualcommax/ipq50xx/base-files/etc/hotplug.d/firmware/11-ath11k-caldata \
            package/boot/uboot-tools/uboot-envtools/files/qualcommax_ipq50xx ; do
            grep -q 'jdcloud,re-cs-03' "$f" || { echo "  MISSING device entry in $f"; exit 1; }
            echo "  ok device entry in $(basename "$f")"
          done

          echo "== kernel warning flags (fatal: the 6.12 tree promotes warnings) =="
          grep -qE '^CONFIG_KERNEL_CFLAGS=.*Wno-missing-prototypes' .config \
            || { echo "  CONFIG_KERNEL_CFLAGS lacks -Wno-missing-prototypes"; exit 1; }
          echo "  ok CONFIG_KERNEL_CFLAGS silences missing-prototypes"
          grep -q -- '-Wno-missing-prototypes' feeds/nss_packages/qca-nss-crypto/Makefile \
            || { echo "  qca-nss-crypto Makefile was not patched"; exit 1; }
          echo "  ok qca-nss-crypto EXTRA_CFLAGS patched"
          echo "VERIFY OK"

      - name: Use /mnt for more disk space
        if: always()
        run: |
          sudo mkdir -p /mnt/upper /mnt/work && sudo chmod a+w /mnt/upper
          sudo mount -t overlay -olowerdir=$(pwd),upperdir=/mnt/upper,workdir=/mnt/work overlay $(pwd) && df -hT

      - name: Restore cache from previous build
        uses: actions/cache@v4
        if: always()
        with:
          key: openwrt-build-${{ env.REMOTE_BRANCH }}-${{ needs.check_commits.outputs.latest_commit_sha }}
          restore-keys: |
            openwrt-build-${{ env.REMOTE_BRANCH }}-
            openwrt-build
          path: |
            build_dir
            dl
            staging_dir
            tmp

      - name: Clean up old caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/caches --paginate --jq '.actions_caches[0:] | .[] |.key' | while read key; do
            echo "Removing old cache $key ..."
            gh api -X DELETE "/repos/${{ github.repository }}/actions/caches?key=$key" 2>/dev/null || true
          done

      - name: Download packages
        run: |
          df -hT
          ./scripts/feeds update -a
          make download -j$(nproc)
          
      - name: Build firmware
        env: 
          CMAKE_POLICY_VERSION_MINIMUM: 3.5
        run: |
          df -hT
          make check -j$(nproc) FIXUP=1 V=s
          make -j$(nproc) || make -j1 V=s  # Retry single-threaded on failure
          tar cvzf bin/targets/qualcommax/ipq50xx/snapshots.tar.gz -C bin packages/aarch64_cortex-a53 targets/qualcommax/ipq50xx/packages

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ipq50xx-images
          path: bin/targets/qualcommax/ipq50xx

      - name: Check disk space usage
        if: always()
        run: df -hT
        
  release:
    name: Create release
    needs: [check_commits, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ipq50xx-images
          path: firmware
      - name: Set release date
        run: echo "RELEASE_DATE=$(date +%F)" >> $GITHUB_ENV
      - name: Publish release
        uses: softprops/action-gh-release@master
        with:
          files: firmware/*
          tag_name: ${{ env.RELEASE_PREFIX }}-${{ env.RELEASE_DATE }}
          name: 🚀 OpenWrt Build Release ${{ env.RELEASE_DATE }}
          body: |
            ## 📦 OpenWrt Automated Build Release

            **Build Date:** ${{ env.RELEASE_DATE }}
            **Base:** [${{ env.REMOTE_REPOSITORY }}](https://github.com/${{ env.REMOTE_REPOSITORY }}) `${{ env.REMOTE_BRANCH }}` -- OpenWrt 25.12 stable + NSS offload (kernel 6.12)

            ### 🔄 Main Repository
            **Repository:** [${{ env.REMOTE_REPOSITORY }}](https://github.com/${{ env.REMOTE_REPOSITORY }})
            **Upstream ref:** `${{ env.REMOTE_BRANCH }}` (OpenWrt stable base, not snapshot)
            **Commit:** `${{ needs.check_commits.outputs.latest_commit_sha }}`

            ### 📝 Build Information
            - **Target:** [JDCloud RE-CS-03 后羿/哪吒]
            - **Configuration:** [`${{ env.CONFIG_FILE }}`](${{ env.CONFIG_FILE }})

            ### 📋 Notes
            - Automated build triggered by ${{ github.event_name }}
            - Previous releases are automatically cleaned up (keeping latest 5)
            ---
            _Generated by GitHub Actions 🤖_

      - name: Clean up old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          df -hT
          gh api repos/${{ github.repository }}/releases --paginate --jq '.[5:10] | .[] | "\(.id) \(.tag_name)"' | while read id tag; do
            day=$(echo "$tag" |cut -d'-' -f4)
            if [ $day -ne "02" ] && [ $day -ne "09" ] && [ $day -ne "16" ] && [ $day -ne "24" ]; then
              echo "Removing old release $tag ..."
              gh api -X DELETE "repos/${{ github.repository }}/releases/$id" && gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$tag" 2>/dev/null || true
            fi
          done
