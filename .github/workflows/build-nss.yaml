name: Build OpenWrt NSS (kernel 6.12 fork, artifacts only)

# Separate, opt-in pipeline. It builds the SAME firmware configuration as
# build.yaml, but on the NSS tree instead of vanilla upstream OpenWrt:
#
#   qosmio/openwrt-ipq @ main-nss   (kernel 6.12.92, mac80211 backports 6.12.6)
#
# 6.12 is the newest kernel the NSS patch set supports. Vanilla OpenWrt (what
# build.yaml builds) has no NSS symbols at all: no qca-ssdk, no
# kmod-qca-nss-drv, no CONFIG_ATH11K_NSS_SUPPORT, so NSS cannot be enabled
# there. Our device patch and our seed are reused unchanged, except that
# re-cs-03-nss.config carries the NSS block.
#
# No release job on purpose: artifacts only.

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-nss.yaml'
      - 're-cs-03-nss.config'
      - 'ci/**'
      - 'patches/**'
      - 'files/**'
      - 'luci-app-accesscontrol.zip'
  workflow_dispatch:

env:
  REMOTE_REPOSITORY: qosmio/openwrt-ipq
  REMOTE_BRANCH: main-nss
  CONFIG_FILE: re-cs-03-nss.config
  CUSTOM_FILES_PATH: files/

jobs:
  build:
    name: Build OpenWrt NSS
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: sudo apt update && sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget patch

      - name: Checkout NSS tree
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REMOTE_REPOSITORY }}
          ref: ${{ env.REMOTE_BRANCH }}
          fetch-depth: 1

      - name: Show tree info
        id: tree
        run: |
          df -hT
          echo "repo:   ${{ env.REMOTE_REPOSITORY }}@${{ env.REMOTE_BRANCH }}"
          echo "kernel: $(sed -n 's/^KERNEL_PATCHVER:=//p' target/linux/qualcommax/Makefile)"
          git log -1 --format='tree tip: %H %ad %s' --date=short | tee -a "$GITHUB_STEP_SUMMARY"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          path: "builder_repo"

      - name: Apply custom patches
        run: |
          # Applied per file on purpose: `git apply` is atomic, so a single drifted file
          # would block the whole patch -- including the two binary board files that only
          # git can apply (GNU patch cannot). Rejected files are ported by ci/nss-port.py.
          python3 - <<'PY'
          import io, os, re
          p = io.open('builder_repo/patches/re-cs-03-mainline.patch', encoding='utf-8', newline='').read()
          parts = [c for c in re.split(r'(?m)^(?=diff --git )', p) if c.strip()]
          os.makedirs('/tmp/patchparts', exist_ok=True)
          for i, c in enumerate(parts):
              io.open('/tmp/patchparts/%02d.patch' % i, 'w', encoding='utf-8', newline='').write(c)
          print("%d patch parts" % len(parts))
          PY
          shopt -s nullglob
          rejected=""
          for part in /tmp/patchparts/*.patch; do
            f="$(sed -n 's|^+++ b/||p' "$part" | head -1)"
            if git apply --verbose "$part"; then
              echo "applied: $f"
            else
              echo "::warning::hunk rejected on this tree (will be ported): $f"
              rejected="$rejected $f"
            fi
          done
          echo "rejected:${rejected:- none}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Port the device support onto this tree
        run: |
          set -euo pipefail
          python3 builder_repo/ci/nss-port.py

      - name: Ensure jdcloud re-cs-03 device definition exists
        run: |
          set -euo pipefail
          mk=/image/ipq50xx.mk
          f=target/linux/qualcommax$mk
          if ! grep -q 'Device/jdcloud_re-cs-03' "$f"; then
            # The fork's ipq50xx.mk is a different base than the tree the patch was
            # generated on, so this hunk can be rejected. The block is self-contained;
            # append it verbatim rather than failing the whole build.
            echo "device definition missing after patching -> appending fallback block"
            cat >> "$f" <<'EOF'

          define Device/jdcloud_re-cs-03
          	$(call Device/FitImage)
          	SOC := ipq5018
          	BLOCKSIZE := 64k
          	KERNEL_SIZE := 6144k
          	DEVICE_VENDOR := JDCloud
          	DEVICE_MODEL := AX3000
          	DEVICE_DTS_CONFIG := config@mp03.5-c2
          	IMAGES := factory.bin sysupgrade.bin
          	IMAGE/factory.bin := append-kernel | pad-to $$$$(KERNEL_SIZE) | append-rootfs | append-metadata
          	IMAGE/sysupgrade.bin/squashfs := append-rootfs | pad-to 64k | sysupgrade-tar rootfs=$$$$@ | append-metadata
          	DEVICE_PACKAGES := ath11k-firmware-ipq5018-qcn6122 \
          		ipq-wifi-jdcloud_re-cs-03
          endef
          TARGET_DEVICES += jdcloud_re-cs-03
          EOF
          fi
          grep -n 'Device/jdcloud_re-cs-03' "$f"

      - name: Update and install feeds
        run: |
          df -hT
          # third-party feed supplying luci-app-{aliddns,autoreboot,filetransfer,socat,vlmcsd}
          echo 'src-git small https://github.com/kenzok8/small-package' >> feeds.conf.default
          # the NSS tree already carries: src-git nss_packages ...;NSS-12.5-K6.x
          #                             src-git sqm_scripts_nss ...
          ./scripts/feeds update -a
          ./scripts/feeds install -a -p luci && ./scripts/feeds install -a -p packages && ./scripts/feeds install -a -p small
          ./scripts/feeds install -a -p nss_packages || echo "::warning::feeds install -p nss_packages failed"
          ./scripts/feeds install -a -p sqm_scripts_nss || echo "::warning::feeds install -p sqm_scripts_nss failed"
          git clone https://github.com/Openwrt-Passwall/openwrt-passwall2.git package/feeds/luci/luci-app-passwall2
          git clone https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git package/utils/passwall2
          git clone https://github.com/jerrykuku/luci-theme-argon.git package/feeds/luci/luci-theme-argon
          git clone https://github.com/jerrykuku/luci-app-argon-config.git package/feeds/luci/luci-app-argon-config
          # accesscontrol: place it where the package scanner collects it, and rewrite the
          # relative `include ../../luci.mk` -> absolute, because package/feeds/luci/ is a
          # plain dir of per-package symlinks with no luci.mk (a failing include makes the
          # scanner skip the package and silently drop CONFIG_PACKAGE_... from .config).
          unzip builder_repo/luci-app-accesscontrol.zip -d package/feeds/luci
          sed -i 's#include ../../luci.mk#include $(TOPDIR)/feeds/luci/luci.mk#' package/feeds/luci/luci-app-accesscontrol-main/Makefile
          grep -q 'luci.mk' package/feeds/luci/luci-app-accesscontrol-main/Makefile

      - name: Setup configuration and custom files
        run: |
          df -hT
          cp builder_repo/${{ env.CONFIG_FILE }} .config
          make defconfig -j$(nproc)
          mkdir -p ${{ env.CUSTOM_FILES_PATH }}
          [ -d "builder_repo/${{ env.CUSTOM_FILES_PATH }}" ] && mv builder_repo/${{ env.CUSTOM_FILES_PATH }}* ${{ env.CUSTOM_FILES_PATH }} || true

      - name: Verify configuration and patches applied
        run: |
          set -euo pipefail
          echo "== device support (fatal) =="
          grep -q 'Device/jdcloud_re-cs-03' target/linux/qualcommax/image/ipq50xx.mk \
            || { echo "  MISSING device def in ipq50xx.mk"; exit 1; }
          echo "  ok Device/jdcloud_re-cs-03 (ipq50xx.mk)"
          for f in \
            target/linux/qualcommax/dts/ipq5018-re-cs-03.dts \
            package/firmware/ipq-wifi/files/board-jdcloud_re-cs-03.ipq5018 \
            package/firmware/ipq-wifi/files/board-jdcloud_re-cs-03.qcn6122 ; do
            [ -f "$f" ] || { echo "  MISSING $f"; exit 1; }
            echo "  ok $f"
          done
          grep -q "^CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_jdcloud_re-cs-03=y" .config \
            || { echo "  target device not selected in .config"; exit 1; }
          echo "  ok target device selected"
          for f in \
            target/linux/qualcommax/ipq50xx/base-files/etc/board.d/02_network \
            target/linux/qualcommax/ipq50xx/base-files/lib/upgrade/platform.sh \
            target/linux/qualcommax/ipq50xx/base-files/etc/hotplug.d/firmware/11-ath11k-caldata \
            package/boot/uboot-tools/uboot-envtools/files/qualcommax_ipq50xx ; do
            grep -q 'jdcloud,re-cs-03' "$f" || { echo "  MISSING device entry in $f"; exit 1; }
            echo "  ok device entry in $(basename "$f")"
          done
          # the device's DEVICE_PACKAGES name this package, so a missing def breaks the image
          echo "== diagnostics: ipq-wifi package registration =="
          printf '  tmp/.config-package.in lines: %s\n' "$(wc -l < tmp/.config-package.in)"
          printf '  config PACKAGE_ipq-wifi-* entries: %s\n' "$(grep -cE '^[[:space:]]*config PACKAGE_ipq-wifi' tmp/.config-package.in || true)"
          printf '  tmp/.packageinfo ipq-wifi hits: %s\n' "$(grep -c 'ipq-wifi' tmp/.packageinfo 2>/dev/null || echo 0)"
          grep -n 'jdcloud_re-cs' tmp/.config-package.in 2>/dev/null | head -5 || echo "  no jdcloud_re-cs in tmp/.config-package.in"
          grep -n 'jdcloud_re-cs' tmp/.packageinfo 2>/dev/null | head -5 || echo "  no jdcloud_re-cs in tmp/.packageinfo"
          grep -qE '^[[:space:]]*config PACKAGE_ipq-wifi-jdcloud_re-cs-03([[:space:]]|\$)' tmp/.config-package.in \
            || { echo "  ipq-wifi-jdcloud_re-cs-03 not registered in tmp/.config-package.in"; exit 1; }
          echo "  ok ipq-wifi-jdcloud_re-cs-03 registered"
          grep -q 'caldata_extract_mmc()' package/base-files/files/lib/functions/caldata.sh \
            || { echo "  caldata_extract_mmc() missing from caldata.sh"; exit 1; }
          echo "  ok caldata_extract_mmc() available"

          echo "== NSS (fatal: the whole point of this workflow) =="
          nsscheck() {
            local sym="$1" got
            got="$(grep -m1 -E "^${sym}=" .config || true)"
            printf '  %-52s %s\n' "$sym" "${got:-<MISSING>}"
            [ "$got" = "${sym}=y" ] || { echo "  ^^^ expected ${sym}=y"; exit 1; }
          }
          nsscheck CONFIG_PACKAGE_kmod-qca-nss-drv
          nsscheck CONFIG_PACKAGE_kmod-qca-nss-ecm
          # download path: the fork carries qca-ssdk + qca-nss-dp in-tree
          if grep -qE '^CONFIG_PACKAGE_kmod-qca-nss-dp=y' .config; then
            echo "  ok CONFIG_PACKAGE_kmod-qca-nss-dp"
          elif grep -qE '^CONFIG_PACKAGE_kmod-qca-ssdk=y' .config; then
            echo "  ok CONFIG_PACKAGE_kmod-qca-ssdk"
          else
            echo "  neither kmod-qca-nss-dp nor kmod-qca-ssdk selected"; exit 1
          fi

          echo "== NSS (soft: nice to have, not fatal) =="
          for sym in CONFIG_ATH11K_NSS_SUPPORT \
                     CONFIG_PACKAGE_MAC80211_NSS_SUPPORT \
                     CONFIG_PACKAGE_kmod-qca-nss-drv-bridge-mgr \
                     CONFIG_PACKAGE_kmod-qca-nss-drv-vlan-mgr \
                     CONFIG_PACKAGE_kmod-qca-nss-drv-pppoe \
                     CONFIG_PACKAGE_kmod-qca-mcs \
                     CONFIG_PACKAGE_sqm-scripts-nss \
                     CONFIG_NSS_MEM_PROFILE_MEDIUM \
                     CONFIG_NSS_FIRMWARE_VERSION_12_5 ; do
            if grep -qE "^${sym}=[ym]$" .config; then s="$(grep -m1 -E "^${sym}=" .config)"; else s="not-set/absent"; fi
            printf '  %-52s %s\n' "$sym" "$s"
          done

          echo "== seed packages the 6.12 tree does not know (informational) =="
          # The seed is written for the vanilla 6.18 tree; packages added upstream
          # after this fork's base (2026-06) simply have no symbol here. Report
          # them, do not fail: they are not what this build is about.
          n=0; miss=0
          while read -r sym; do
            n=$((n + 1))
            grep -qE "^${sym}=[ym]$" .config || { echo "  dropped: $sym"; miss=$((miss + 1)); }
          done < <(grep -oE '^CONFIG_PACKAGE_[A-Za-z0-9._+-]+=y' builder_repo/${{ env.CONFIG_FILE }} | sed 's/=y$//' | sort -u)
          echo "  checked $n seed CONFIG_PACKAGE_*=y symbols, $miss dropped by the 6.12 tree"

          echo "== custom files / hostname (fatal) =="
          grep -q "hostname='OpenWrt'" package/base-files/files/bin/config_generate
          echo "  ok config_generate hostname=OpenWrt"
          [ -f files/etc/shadow ] || { echo "  MISSING files/etc/shadow"; exit 1; }
          grep -q '^root:\$6\$' files/etc/shadow || { echo "  files/etc/shadow has no root hash"; exit 1; }
          echo "  ok files/etc/shadow (root password preset)"
          grep -q "set network.lan.ipv6='1'" files/etc/uci-defaults/999-QOL_config
          grep -q "set dhcp.lan.ra='server'" files/etc/uci-defaults/999-QOL_config
          echo "  ok IPv6 enabled (lan/wan/br-lan, LAN RA+DHCPv6 server)"
          echo "VERIFY OK"

      - name: Use /mnt for more disk space
        if: always()
        run: |
          sudo mkdir -p /mnt/upper /mnt/work && sudo chmod a+w /mnt/upper
          sudo mount -t overlay -olowerdir=$(pwd),upperdir=/mnt/upper,workdir=/mnt/work overlay $(pwd) && df -hT

      - name: Restore cache from previous build
        uses: actions/cache@v4
        if: always()
        with:
          # separate namespace from the main build: different tree, toolchain and
          # kernel, so the two must never share build_dir/dl.
          key: openwrt-nss-build-${{ steps.tree.outputs.sha }}
          restore-keys: |
            openwrt-nss-build
          path: |
            build_dir
            dl
            staging_dir
            tmp

      - name: Download packages
        run: |
          df -hT
          ./scripts/feeds update -a
          make download -j$(nproc)

      - name: Build firmware
        env:
          CMAKE_POLICY_VERSION_MINIMUM: 3.5
        run: |
          df -hT
          make -j$(nproc) || make -j1 V=s  # Retry single-threaded on failure
          ls -lh bin/targets/qualcommax/ipq50xx/

      - name: Collect artifacts
        run: |
          d=bin/targets/qualcommax/ipq50xx
          sha256sum $d/*squashfs-factory.bin $d/*squashfs-sysupgrade.bin $d/*initramfs-uImage.itb | tee "$RUNNER_TEMP/sha256sums-nss.txt"
          {
            echo "## NSS build artifacts"
            echo ""
            echo "tree: \`${{ env.REMOTE_REPOSITORY }}@${{ env.REMOTE_BRANCH }}\` (kernel 6.12)"
            echo "config: \`${{ env.CONFIG_FILE }}\`"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/sha256sums-nss.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts (two bin + itb)
        uses: actions/upload-artifact@v4
        with:
          name: ipq50xx-nss-images
          path: |
            bin/targets/qualcommax/ipq50xx/*squashfs-factory.bin
            bin/targets/qualcommax/ipq50xx/*squashfs-sysupgrade.bin
            bin/targets/qualcommax/ipq50xx/*initramfs-uImage.itb
          retention-days: 30
          if-no-files-found: error

      - name: Upload artifacts (full target dir)
        uses: actions/upload-artifact@v4
        with:
          name: ipq50xx-nss-target-dir
          path: bin/targets/qualcommax/ipq50xx
          retention-days: 30
          if-no-files-found: error

      - name: Check disk space usage
        if: always()
        run: df -hT
